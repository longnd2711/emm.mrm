<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lịch họp HEM EMM</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><clipPath id='c'><rect width='100' height='100' rx='25'/></clipPath></defs><g clip-path='url(%23c)'><rect width='100' height='100' fill='%23f97316'/><polygon points='100,0 100,100 0,100' fill='%233b82f6'/></g><text x='50' y='72' font-family='Arial, sans-serif' font-size='55' font-weight='bold' fill='white' text-anchor='middle'>31</text></svg>">
        
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- BỔ SUNG: Thư viện Flatpickr cho tính năng đặt lịch nhiều ngày -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        /* --- GIAO DIỆN MẶC ĐỊNH (BASE STYLES) --- */
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .loader { border-top-color: #2563eb; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .schedule-grid-bg { background-image: linear-gradient(to bottom, #f8fafc 1px, transparent 1px); background-size: 100% 60px; }
        .schedule-block { transition: all 0.2s ease; }
        .schedule-block:hover { filter: brightness(0.95); transform: scale(1.02); z-index: 20; }

        /* Tinh chỉnh riêng cho Flatpickr input hòa hợp với theme */
        .flatpickr-input[readonly] { background-color: #ffffff; }
        
        /* --- THEMES (Bản thu gọn để tiết kiệm không gian, giữ nguyên logic CSS của bạn) --- */
        [data-theme="light-glass"] body { background: linear-gradient(160deg, #243545 0%, #305461 40%, #68b8b1 100%) !important; background-attachment: fixed !important;}
        [data-theme="light-glass"] .neon-container { background-color: rgba(255, 255, 255, 0.15) !important; backdrop-filter: blur(24px) !important; border-radius: 28px !important; }
        [data-theme="light-glass"] .bg-white { background-color: rgba(255, 255, 255, 0.6) !important; backdrop-filter: blur(12px) !important; }
        [data-theme="light-glass"] input:not([type="hidden"]), [data-theme="light-glass"] select, [data-theme="light-glass"] textarea { background-color: rgba(255,255,255,0.8) !important; }
    </style>
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('emm_theme') || 'light-glass';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Loader & Toast -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/90 z-[99998] flex flex-col items-center justify-center hidden backdrop-blur-sm">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-12 w-12 mb-4"></div>
        <p class="text-blue-600 font-bold text-sm tracking-wide">Đang xử lý / cập nhật dữ liệu...</p>
    </div>
    <div id="toast" class="fixed top-4 right-4 left-4 md:left-auto md:w-96 z-[99999] transform translate-y-[-150%] transition-transform duration-300 pointer-events-none">
        <div id="toastContent" class="bg-white border-l-4 p-4 shadow-lg rounded-xl flex items-center"></div>
    </div>

    <div id="publicAppView" class="neon-container max-w-xl mx-auto px-4 pt-6 pb-8 flex-1 w-full flex flex-col mt-6 mb-6">
        
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-600 leading-tight mb-2 flex items-center justify-center gap-2">Lịch họp HEM EMM</h1>
            <div id="userSessionBar" class="mt-4 flex flex-col sm:flex-row items-center justify-center gap-3 text-sm bg-white py-3 px-4 rounded-2xl shadow-sm border border-slate-100 hidden">
                <span class="text-slate-600">Xin chào, <a href="javascript:void(0)" onclick="openProfileModal()" id="currentUserEmail" class="font-bold text-blue-600 hover:text-blue-800 hover:underline transition-colors"></a></span>
                <div class="flex gap-4 sm:border-l sm:pl-4 border-slate-200 flex-wrap justify-center">
                    <button onclick="logout()" class="text-red-500 hover:underline font-medium flex items-center gap-1">Đăng xuất</button>
                </div>
            </div>
            <button id="loginBtn" onclick="openLoginModal()" class="mt-5 px-8 py-3 bg-slate-800 text-white text-sm font-bold rounded-2xl shadow-md w-full sm:w-auto">Đăng nhập hệ thống</button>
        </header>

        <section id="formSection" class="bg-white rounded-3xl shadow-sm border border-slate-200 p-4 sm:p-5 hidden mb-6 relative">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold flex items-center">
                    <span class="w-1.5 h-5 bg-emerald-500 rounded-full mr-2"></span> Thông tin cuộc họp
                </h2>
            </div>
            
            <form id="bookingForm" onsubmit="handleBookingSubmit(event)" class="space-y-4">
                <input type="hidden" id="editRowIndex" name="rowIndex"> 
                <input type="hidden" id="fEmpId" name="empId">
                <input type="hidden" id="fGuests" name="guests"> 
                
                <div>
                    <label class="block text-xs font-semibold mb-1.5 text-slate-500 uppercase tracking-wide">Tên cuộc họp</label>
                    <input type="text" name="title" id="fTitle" required placeholder="Ví dụ: Họp Giao Ban Tuần" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-sm">
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <!-- BỔ SUNG: Header chứa nút Lặp lại -->
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">Ngày họp</label>
                            <button type="button" id="btnRecurring" onclick="activateRecurringMode()" class="hidden text-[10px] text-indigo-600 font-bold hover:underline bg-indigo-50 px-2 py-0.5 rounded-md transition-colors">Lặp lại nhiều ngày</button>
                        </div>
                        <div class="relative">
                            <!-- Chế độ 1 ngày (Mặc định) -->
                            <select id="dateSelect" name="date" required onchange="updateStartTimes()" class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-sm bg-white"><option value="">-- Chọn --</option></select>
                            
                            <!-- BỔ SUNG: Chế độ Nhiều ngày (Flatpickr) -->
                            <input type="text" id="dateInputMulti" placeholder="Chọn các ngày (Tối đa 6)..." class="hidden w-full px-3 py-3 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-sm bg-white cursor-pointer">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1.5 text-slate-500 uppercase tracking-wide">Phòng họp</label>
                        <select id="roomSelect" name="room" required onchange="updateStartTimes()" class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-sm bg-white"><option value="">-- Chọn --</option></select>
                    </div>
                </div>

                <div id="timeContainer" class="hidden space-y-4 pt-3 border-t border-slate-100">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold mb-1.5 text-slate-500 uppercase tracking-wide">Bắt đầu</label>
                            <select id="startSelect" name="start" required onchange="updateEndTimes()" class="w-full px-2 py-3 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-sm bg-white"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1.5 text-slate-500 uppercase tracking-wide">Kết thúc</label>
                            <!-- BỔ SUNG: Thêm sự kiện onchange để check hiện nút Lặp lại -->
                            <select id="endSelect" name="end" required onchange="checkShowRecurringBtn()" class="w-full px-2 py-3 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-sm bg-white"></select>
                        </div>
                    </div>
                </div>
                
                <!-- Bỏ qua phần khách mời & Ghi chú để code gọn, giữ nguyên logic gốc của bạn -->

                <div class="pt-4">
                    <button type="submit" id="submitBtn" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-200 active:scale-[0.98] transition-all">Xác nhận Đặt phòng</button>
                    <button type="button" id="cancelEditBtn" onclick="resetEditState()" class="w-full mt-3 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl transition-all hidden">Hủy</button>
                </div>
            </form>
        </section>

        <!-- Placeholder Lịch biểu -->
        <section id="scheduleSection" class="bg-white rounded-3xl p-5 hidden mb-6"><h2 class="font-bold text-slate-800">Lịch biểu</h2></section>

    </div>

    <!-- Modals Giữ nguyên... -->

    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/booking.js"></script>
</body>
</html>
