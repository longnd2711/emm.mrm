<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8fafc; margin: 0; padding: 0;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f8fafc; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 0 auto;">
                    <!-- HEADER -->
                    <tr>
                        <td style="background-color: <?= actionType === 'HỦY LỊCH' ? '#e11d48' : '#2563eb' ?>; padding: 40px 30px; text-align: center;">
                            <div style="background-color: rgba(255,255,255,0.2); border-radius: 50%; width: 60px; height: 60px; line-height: 60px; display: inline-block; margin-bottom: 15px;">
                                <!-- Sử dụng HTML Entity: &#10060; cho ❌, &#128197; cho 📅 -->
                                <span style="font-size: 30px;"><?= actionType === 'HỦY LỊCH' ? '&#10060;' : '&#128197;' ?></span>
                            </div>
                            <h1 style="color: #ffffff; margin: 0; font-size: 24px;">Thông báo <?= actionType ?></h1>
                            <p style="color: rgba(255,255,255,0.9); font-size: 16px; margin-top: 10px;">Hệ thống Đặt Phòng Họp EMM</p>
                        </td>
                    </tr>
                    <!-- BODY -->
                    <tr>
                        <td style="padding: 40px 30px; color: #334155; font-size: 16px; line-height: 1.5;">
                            <p style="margin-top: 0;">Xin chào,</p>
                            <p>Hệ thống xin thông báo trạng thái lịch họp <b><?= bookingInfo.title ?></b> đã được cập nhật thành: <strong><?= actionType ?></strong>.</p>
                            
                            <div style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin: 25px 0;">
                                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="color: #334155;">
                                    <tr>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e2e8f0; width: 100px; color: #64748b;">Người đặt:</td>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e2e8f0; font-weight: bold;"><?= bookingInfo.user ?></td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e2e8f0; color: #64748b;">Phòng:</td>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e2e8f0; font-weight: bold; color: #059669;"><?= bookingInfo.room ?></td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e2e8f0; color: #64748b;">Thời gian:</td>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e2e8f0; font-weight: bold;"><?= bookingInfo.start ?> - <?= bookingInfo.end ?> (Ngày <?= bookingInfo.date ?>)</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 10px 0; border-bottom: <?= reason ? '1px solid #e2e8f0' : 'none' ?>; color: #64748b;">Yêu cầu:</td>
                                        <td style="padding: 10px 0; border-bottom: <?= reason ? '1px solid #e2e8f0' : 'none' ?>;"><?= bookingInfo.note || 'Không' ?></td>
                                    </tr>
                                    <? if (reason) { ?>
                                    <tr>
                                        <td style="padding: 10px 0; color: #e11d48;">Lý do:</td>
                                        <td style="padding: 10px 0; color: #e11d48; font-weight: bold;"><?= reason ?></td>
                                    </tr>
                                    <? } ?>
                                </table>
                            </div>
                            
                            <? if (actionType !== 'HỦY LỊCH' && appUrl) { ?>
                            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top: 30px;">
                                <tr>
                                    <td align="center">
                                        <a href="<?= appUrl ?>" style="display: inline-block; padding: 14px 30px; background-color: #2563eb; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 15px; text-transform: uppercase;">Xem trên Hệ thống</a>
                                    </td>
                                </tr>
                            </table>
                            <? } ?>
                        </td>
                    </tr>
                    <!-- FOOTER -->
                    <tr>
                        <td style="background-color: #f1f5f9; padding: 20px; text-align: center; border-top: 1px solid #e2e8f0;">
                            <p style="color: #94a3b8; font-size: 12px; margin: 0; line-height: 1.5;">
                                Đây là email được gửi tự động từ hệ thống <strong>EMM Booking</strong>.<br>Vui lòng không trả lời email này.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
