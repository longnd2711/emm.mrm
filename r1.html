<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản in QR - Phòng họp số 1</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0; /* Nền ngoài cho màn hình preview */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1, h2, .font-urbanist {
            font-family: 'Urbanist', sans-serif;
        }

        /* Container cố định tỷ lệ A5 (148 x 210 mm) */
        .a5-container {
            width: 148mm;
            height: 210mm;
            background-color: #ffffff;
            color: #0f172a;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        /* Dải viền trang trí thương hiệu HEM (Xanh - Cam) */
        .brand-top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 8px;
            background-color: #1e40af; /* Xanh dương đậm */
        }
        
        .brand-bottom-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 8px;
            background-color: #f97316; /* Cam */
        }

        /* Nút in chỉ hiển thị trên màn hình */
        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #1e40af;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(30, 64, 175, 0.4);
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            z-index: 100;
        }
        
        .print-btn:hover {
            background-color: #1e3a8a;
            transform: translateY(-2px);
        }

        /* Cấu hình khi in */
        @media print {
            @page {
                size: A5 portrait;
                margin: 0; 
            }
            body {
                background-color: #ffffff;
                padding: 0;
                margin: 0;
            }
            .print-btn {
                display: none;
            }
            .a5-container {
                box-shadow: none; 
                width: 100vw;
                height: 100vh;
                margin: 0;
                page-break-after: avoid;
                border: none !important;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
        
        /* Họa tiết nền mờ để không bị đơn điệu */
        .bg-pattern {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.5;
            z-index: 0;
        }
    </style>
</head>
<body>

    <button onclick="window.print()" class="print-btn">
        <i class="fa-solid fa-print"></i> IN BẢN NÀY (A5)
    </button>

    <div class="a5-container relative border border-slate-200">
        
        <div class="brand-top-bar z-20"></div>
        <div class="brand-bottom-bar z-20"></div>
        <div class="bg-pattern"></div>

        <!-- HEADER -->
        <div class="pt-14 pb-4 px-8 text-center relative z-10">
            <div class="inline-flex items-center justify-center gap-2 bg-blue-50 text-blue-800 px-5 py-2 rounded-full text-base font-bold tracking-widest uppercase mb-5 border border-blue-100 shadow-sm">
                <i class="fa-solid fa-building text-lg text-blue-600"></i> LỊCH HỌP HEM EMM
            </div>
            
            <h2 class="text-[22px] font-urbanist font-bold text-slate-500 tracking-[0.2em] uppercase mb-1">
                Phòng Họp
            </h2>
            <h1 class="text-7xl font-urbanist font-black text-blue-900 uppercase tracking-tighter drop-shadow-sm">
                SỐ 1
            </h1>
            
            <!-- Vạch màu cam trang trí dưới tiêu đề -->
            <div class="w-16 h-1.5 bg-orange-500 mx-auto mt-4 rounded-full"></div>
        </div>

        <!-- KHU VỰC QR CODE -->
        <div class="flex-1 flex flex-col items-center justify-center relative z-10 px-8">
            
            <!-- Khung QR Code -->
            <div class="relative p-4 bg-white rounded-2xl shadow-[0_15px_40px_rgba(30,64,175,0.1)] border border-slate-100 mb-6 transition-transform">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https%3A%2F%2Flongnd2711.github.io%2Femm.mrm%2F%23r1&margin=0" 
                     alt="QR Code Phòng 1" 
                     class="w-[200px] h-[200px] object-contain rounded-lg">
            </div>

            <!-- Dòng kêu gọi hành động (CTA) -->
            <div class="text-center w-full">
                <h3 class="text-xl font-urbanist font-bold text-blue-800 mb-2 tracking-wide">
                    Quét mã để bắt đầu
                </h3>
                <p class="text-slate-600 text-sm leading-relaxed px-2 font-medium">
                    Xem lịch trống & Đăng ký sử dụng phòng
                </p>
            </div>
        </div>

        <!-- FOOTER / CONTACT INFO -->
        <div class="mt-auto mb-10 mx-6 relative z-10">
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-xl shadow-slate-200/50">
                <p class="text-center text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-3 pb-3 border-b border-slate-100">
                    <i class="fa-solid fa-headset mr-1"></i> Thông tin hỗ trợ
                </p>
                
                <div class="grid grid-cols-2 gap-3">
                    <!-- Hỗ trợ kỹ thuật -->
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 border border-blue-100">
                            <i class="fa-solid fa-laptop-code text-sm"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[9px] text-slate-500 uppercase font-bold tracking-wider">Kỹ thuật (IT)</span>
                            <span class="text-[13px] font-black text-slate-800 tracking-wide">0988 303 852</span>
                        </div>
                    </div>

                    <!-- Hỗ trợ Hậu cần/Lễ tân -->
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-orange-600 border border-orange-100">
                            <i class="fa-solid fa-mug-hot text-sm"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[9px] text-slate-500 uppercase font-bold tracking-wider">Lễ tân</span>
                            <span class="text-[13px] font-black text-slate-800 tracking-wide">0948 242 496</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

</body>
</html>
